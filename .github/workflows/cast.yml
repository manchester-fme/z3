name: CAST

run-name: >-
  CAST: ${{ inputs.action
  || (github.event.schedule == '*/15 * * * *' && 'manager')
  || (github.event.schedule == '5,35 * * * *' && 'build')
  || (github.event.schedule == '0 0 1 * *' && 'coverage')
  || (github.event.schedule == '0 0 * * *' && 'daily-check')
  || (github.event.schedule == '45 0,6,12,18 * * *' && 'fuzz')
  || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options:
          - manager
          - build
          - coverage
          - daily-check
          - fuzz
      commit_hash:
        description: 'Required for fuzz; bypasses queue/schedule lookup for manager and build; ignored on a scheduled run'
        required: false
        type: string
  schedule:
    - cron: '*/15 * * * *'        # manager: check for new commits
    - cron: '5,35 * * * *'        # build: build queued commits
    - cron: '0 0 1 * *'           # coverage: monthly full coverage rebuild
    - cron: '0 0 * * *'           # daily-check: daily rebuild-needed check
    - cron: '45 0,6,12,18 * * *'  # fuzz: fuzz the latest commit

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  manager:
    if: inputs.action == 'manager' || github.event.schedule == '*/15 * * * *'
    uses: manchester-fme/CAST/.github/workflows/manager.yml@main
    with:
      solver: z3
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      commit_hash: ${{ inputs.commit_hash }}
    secrets: inherit

  build:
    if: inputs.action == 'build' || github.event.schedule == '5,35 * * * *'
    uses: manchester-fme/CAST/.github/workflows/build.yml@main
    with:
      solver: z3
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      build_script: z3/.cast/build.sh
      binary_path: build/z3
      commit_hash: ${{ inputs.commit_hash }}
      force_run: true
    secrets: inherit

  coverage:
    if: inputs.action == 'coverage' || github.event.schedule == '0 0 1 * *'
    uses: manchester-fme/CAST/.github/workflows/coverage-mapper.yml@main
    with:
      solver: z3
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: z3/.cast
    secrets: inherit

  daily-check:
    if: inputs.action == 'daily-check' || github.event.schedule == '0 0 * * *'
    uses: manchester-fme/CAST/.github/workflows/coverage-daily-check.yml@main
    with:
      solver: z3
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: z3/.cast
    secrets: inherit

  fuzz:
    if: inputs.action == 'fuzz' || github.event.schedule == '45 0,6,12,18 * * *'
    uses: manchester-fme/CAST/.github/workflows/commit-fuzzer.yml@main
    with:
      solver: z3
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      solver_dir: z3/.cast
      commit_hash: ${{ inputs.commit_hash }}
      # z3's fuzzer.clang_args (for coverage-selected test targeting) hasn't
      # been tuned yet - fuzz the full z3test corpus for now instead of a
      # coverage-selected subset until that's filled in.
      no_coverage: true
    secrets: inherit
