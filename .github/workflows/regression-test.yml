name: CAST Regression Test

# Manual-only gate: proves CAST's triage pipeline still confirms a known,
# already-filed real z3 bug (github.com/manchester-fme/z3/issues/2 - "an
# invalid model was generated", z3's own model_validate=true catching an
# invalid model on a division-by-zero query) before trusting a new CAST
# release. Pinned to the exact commit/archive that originally produced
# that issue - not "whatever the latest bug archive happens to be" - so
# this is deterministic and reproducible on demand.
#
# workflow_dispatch only, deliberately no `schedule:` trigger - this must
# never run automatically, only when a human explicitly asks for it via
# Actions -> CAST Regression Test -> Run workflow.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  known-bug-still-confirms:
    name: z3 0bd679a still confirms "an invalid model was generated"
    uses: manchester-fme/CAST/.github/workflows/regression-test.yml@main
    with:
      solver: z3
      repo_url: ${{ github.server_url }}/${{ github.repository }}  # this fork -- .cast/manifest.json only ever lives here, never in real upstream
      solver_dir: z3/.cast
      archive: manchester-fme/z3/solvers/z3/bugs/bugs-0bd679a-1786499226.tar.gz
      commit_hash: 0bd679a404bee551393fd94ca813ccc7eb034973
      target_cmd: "z3 smt.threads=1 memory_max_size=2048 model_validate=true"
      oracle_cmd: "cvc5 --check-models --check-proofs --strings-exp"
      expected_kind: crash
      expected_msg: "an invalid model was generated"
    secrets: inherit
